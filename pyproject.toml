[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callosum"
version = "0.1.0"
description = "AIDA — two SO-100 arms cooperatively solve a Rubik's cube via decentralized Bi-JEPA (MARL)"
readme = "README.md"
# SAPIEN (ManiSkill's engine) has no wheels for Python 3.13+, so cap at 3.12.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "gymnasium",
]

[project.optional-dependencies]
# GPU simulation — Linux + NVIDIA/CUDA only (ManiSkill / SAPIEN).
sim = [
    "mani-skill ; sys_platform == 'linux'",
    "pettingzoo",
]
# RL training stack (TorchRL + BenchMARL on PyTorch).
train = [
    "torch",
    "tensordict",
    "torchrl",
    "benchmarl",
]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
# `callosum` is installed into the venv in editable mode (default for a project with a
# build-system). That keeps `import callosum` working identically everywhere — pytest,
# scripts/*.py, notebooks, and on the server — instead of depending on cwd/sys.path.

# NOTE — do NOT constrain setuptools>=83 (and do not merge Dependabot's bump of it).
# torch 2.11.0 requires setuptools<82, so forcing 83 silently DOWNGRADES torch
# 2.11.0 -> 2.10.0 (plus torchvision/cudnn/nccl). The advisory it would fix
# (GHSA-h35f-9h28-mq5c) targets sdist building in setuptools; we build with hatchling
# and never publish an sdist, so it does not apply. Revisit when torch drops the pin.
# See docs/setup.md ("CUDA index") for the related torch/CUDA ceiling.

# PyTorch wheels: CUDA 12.8 build on the Linux server (its driver 570 caps CUDA at 12.8);
# on macOS (dev, no GPU sim) torch resolves from PyPI as the CPU/MPS build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
