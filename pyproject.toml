[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callosum"
version = "0.1.0"
description = "AIDA — two SO-100 arms cooperatively solve a Rubik's cube via decentralized Bi-JEPA (MARL)"
readme = "README.md"
# SAPIEN (ManiSkill's engine) has no wheels for Python 3.13+, so cap at 3.12.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "gymnasium",
]

[project.optional-dependencies]
# GPU simulation — Linux + NVIDIA/CUDA only (ManiSkill / SAPIEN).
sim = [
    "mani-skill ; sys_platform == 'linux'",
    "pettingzoo",
]
# RL training stack (TorchRL + BenchMARL on PyTorch).
train = [
    # Upper bound is the LAB SERVER'S DRIVER, not a preference: driver
    # 570.172.08 supports CUDA up to 12.8, and PyPI ships CUDA 13 builds
    # from torch 2.11.0 onward (their deps switch from nvidia-*-cu12 to
    # nvidia-*-cu13), which refuse to initialise with "driver is too old".
    # 2.10.0 is the newest PyPI release still built against CUDA 12.
    # Raise this only after confirming the target machine's driver, or
    # after restoring a pinned CUDA index (see the note further down).
    "torch<2.11",
    "tensordict",
    "torchrl",
    "benchmarl",
    "tensorboard",
]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
# `callosum` is installed into the venv in editable mode (default for a project with a
# build-system). That keeps `import callosum` working identically everywhere — pytest,
# scripts/*.py, notebooks, and on the server — instead of depending on cwd/sys.path.

# NOTE — do NOT constrain setuptools>=83 (and do not merge Dependabot's bump of it)
# without re-checking what it does to torch. This bit us once: torch 2.11.0
# required setuptools<82, so forcing 83 silently DOWNGRADED torch
# 2.11.0 -> 2.10.0 (plus torchvision/cudnn/nccl). We are on torch 2.13.0 now and
# setuptools stays at 81.0.0; re-verify the resolved torch version after any
# setuptools bump. The advisory it would fix
# (GHSA-h35f-9h28-mq5c) targets sdist building in setuptools; we build with hatchling
# and never publish an sdist, so it does not apply. Revisit when torch drops the pin.
# See docs/setup.md ("CUDA index") for the related torch/CUDA ceiling.

# PyTorch wheels: resolved from PyPI on every platform.
#
# This used to force the cu128 index on Linux, because the planned server was an
# RTX 5090 (Blackwell, sm_120) and Blackwell needs CUDA >= 12.8, which PyPI's
# default wheel did not yet carry. Two things changed:
#
#   1. The actual server is an NVIDIA A100 (sm_80, Ampere). Every modern CUDA
#      build supports sm_80, so no special index is needed for it.
#   2. The lab network cannot reach the wheels anyway: download.pytorch.org
#      answers, but redirects wheel downloads to download-r2.pytorch.org
#      (Cloudflare R2), which the egress filter blocks. PyPI and
#      files.pythonhosted.org are reachable, so PyPI is the only workable source.
#
# PyPI's torch wheel is a CUDA build; the CUDA runtime arrives through its
# nvidia-* dependencies, also on PyPI. To go back to a pinned CUDA index (e.g.
# for a Blackwell box on an unrestricted network), restore:
#
#   [[tool.uv.index]]
#   name = "pytorch-cu128"
#   url = "https://download.pytorch.org/whl/cu128"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ holds diagnostic scaffolding, not project code. The environment
# probe must survive ANY machine it is dropped onto, so it catches broad
# exceptions and shells out defensively on purpose — rules that are right for
# callosum/ are wrong for it, and reformatting hand-built cells only adds churn.
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
