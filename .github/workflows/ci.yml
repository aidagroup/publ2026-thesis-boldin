name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the previous (still running) job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # dev + sandbox: CI needs `mujoco` (the CPU MuJoCo sandbox) because the
      # refactored experiment packages import their envs in `__init__`; everything
      # touching ManiSkill/CUDA/ManiSkill-GPU stays server-verified (the `sim` and
      # `train` extras are multi-GB and GPU-only).
      - name: Sync environment (dev + sandbox extras)
        run: uv sync --extra dev --extra sandbox

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Import smoke check
        run: uv run python -c "import callosum, callosum.common, callosum.experiments, callosum.robots"

      - name: Tests (pytest)
        run: uv run pytest -q
